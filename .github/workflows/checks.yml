# push / PR ごとに lint・テスト・秘密の全履歴スキャンを行う。
# sitemill は public なので、既定の github.token で checkout できる。
name: checks

on:
  push:
    branches: [main]
    # pipeline がデータだけをコミットするときは checks を走らせない（Actions 無料枠の節約）。
    # コードや設定の変更では従来どおり走る。
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 保存済み HTML は非公開の ops 側にある。fork からの PR には Secret が渡らないので、
      # そのときは checkout を飛ばし、該当の試験は skip される（tests/fixtures/README.md）
      OPS_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: akiya-atlas
          fetch-depth: 0 # 履歴スキャンのため全履歴を取る
      - uses: actions/checkout@v4
        with:
          repository: hikuzawa/sitemill
          ref: v0.7.4 # タグ固定（ADR 0006）。sitemill の main の変更は自動では入らない
          path: sitemill
      - name: Checkout akiya-atlas-ops（保存済み HTML。private）
        if: env.OPS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: hikuzawa/akiya-atlas-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops
      - name: 保存済み HTML を所定の位置へ（git 管理外）
        if: env.OPS_TOKEN != ''
        run: cp -r ops/fixtures/html akiya-atlas/tests/fixtures/html
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: akiya-atlas
        run: uv sync --frozen
      - working-directory: akiya-atlas
        run: uv run ruff check src tests
      - working-directory: akiya-atlas
        run: uv run pytest -q
      - name: Secret scan (全履歴)
        working-directory: akiya-atlas
        run: uv run sitemill scan-secrets --history

  gitleaks:
    runs-on: ubuntu-latest
    # pull_request では対象コミットの一覧を API から引くので、PR の読み取り権限が要る
    # （無いと "Resource not accessible by integration" で落ちる）
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
