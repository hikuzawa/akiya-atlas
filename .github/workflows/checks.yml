# push / PR ごとに lint・テスト・秘密の全履歴スキャンを行う。
# sitemill は public なので、既定の github.token で checkout できる。
name: checks

on:
  push:
    branches: [main]
    # pipeline がデータだけをコミットするときは checks を走らせない（Actions 無料枠の節約）。
    # コードや設定の変更では従来どおり走る。
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: akiya-atlas
          fetch-depth: 0 # 履歴スキャンのため全履歴を取る
      - uses: actions/checkout@v4
        with:
          repository: hikuzawa/sitemill
          path: sitemill
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: akiya-atlas
        run: uv sync --frozen
      - working-directory: akiya-atlas
        run: uv run ruff check src tests
      - working-directory: akiya-atlas
        run: uv run pytest -q
      - name: Secret scan (全履歴)
        working-directory: akiya-atlas
        run: uv run sitemill scan-secrets --history

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
