# 日次パイプライン: crawl → extract → build → (Secrets が揃っていれば) deploy。
# 設計:
#   - Cloudflare の Secrets が未設定でも crawl → extract → build までは必ず動く。
#   - deploy は Cloudflare の Secrets が両方そろっているときだけ実行し、無ければスキップ（run 自体は成功）。
#   - Secrets を後から登録すれば、ワークフローを変更せずに deploy まで動く。
#   - Pages プロジェクト akiya-atlas は deploy の直前に CI が用意する（無ければ作成、あれば何もしない）。
#     ダッシュボードでの手作業も、トークンをローカルに置くことも要らない。
#   - build の直後に、canonical / sitemap / robots が site.toml の base_url を指すことを検査する
#     （ドメイン切替のときに古いホストが残ったまま配置されるのを止める）。
# 前提（人間側の作業、docs/human-tasks.md）:
#   - GitHub に hikuzawa/sitemill と hikuzawa/akiya-atlas を作成し push する（済み）
#   - Secrets: ANTHROPIC_API_KEY（済み）、CLOUDFLARE_API_TOKEN（Account > Cloudflare Pages: Edit）、
#     CLOUDFLARE_ACCOUNT_ID、GOOGLE_MAPS_EMBED_KEY / CF_WEB_ANALYTICS_TOKEN（任意）。
#     sitemill は public なので読み取り用 PAT は不要
name: pipeline

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      deploy:
        description: "Cloudflare Pages に配置する（Secrets がある場合）"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write # 失敗時に通知 Issue を作成/更新する

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Secrets を env に写して if: で参照できるようにする（if: からは secrets を直接読めない）
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout akiya-atlas
        uses: actions/checkout@v4
        with:
          path: akiya-atlas

      - name: Checkout sitemill (path 依存の隣に置く。ADR 0006)
        uses: actions/checkout@v4
        with:
          repository: hikuzawa/sitemill # public。既定の github.token で checkout できる
          path: sitemill

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore raw HTML cache (git 管理外)
        uses: actions/cache@v4
        with:
          path: |
            akiya-atlas/data/raw
            akiya-atlas/data/llm_cache
          key: akiya-atlas-cache-${{ github.run_id }}
          restore-keys: |
            akiya-atlas-cache-

      - name: Sync
        working-directory: akiya-atlas
        run: uv sync --frozen

      - name: Crawl
        working-directory: akiya-atlas
        run: uv run sitemill crawl

      - name: Extract
        working-directory: akiya-atlas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run sitemill extract

      - name: Build
        working-directory: akiya-atlas
        env:
          GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}
          CF_WEB_ANALYTICS_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: uv run sitemill build

      - name: 公開 URL の検査（canonical / sitemap / robots が site.toml の base_url を指す）
        working-directory: akiya-atlas
        run: uv run python .github/scripts/check_public_urls.py

      - name: Eval (fixture、劣化検知)
        working-directory: akiya-atlas
        run: uv run sitemill eval

      - name: Commit data changes
        working-directory: akiya-atlas
        run: |
          git config user.name "sitemill-bot"
          git config user.email "sitemill-bot@users.noreply.github.com"
          git add data/state data/records data/runs
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) の巡回・抽出結果"
          git push origin HEAD:main

      - name: Cloudflare の Secrets を確認
        id: cf
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare の Secrets が未設定のため deploy をスキップします（crawl→extract→build は完了）"
          fi

      - name: Cloudflare Pages プロジェクトを用意（無ければ作成、あれば何もしない）
        if: >-
          steps.cf.outputs.ready == 'true' &&
          (github.event_name == 'schedule' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: akiya-atlas
        run: |
          # 存在確認は Pages API の GET で行う。200 なら既存なので何もしない、404 なら wrangler で作成する。
          # それ以外（400/401/403 など）はトークンの権限やアカウント ID の問題なので、理由を出して止める。
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          case "$status" in
            200)
              echo "Pages プロジェクト $PROJECT_NAME は既に存在する（$(jq -r '.result.subdomain // "?"' "$body")）。作成はスキップ"
              ;;
            404)
              echo "Pages プロジェクト $PROJECT_NAME が無いので作成する（production branch: main）"
              # --force: 新規の静的プロジェクトを Workers に振り替える wrangler の自動委譲を使わず、
              # 必ず Pages プロジェクト（akiya-atlas.pages.dev）として作る
              npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main --force
              ;;
            *)
              echo "::error::Pages API が HTTP $status を返した。CLOUDFLARE_API_TOKEN に Account > Cloudflare Pages: Edit の権限があるか、CLOUDFLARE_ACCOUNT_ID が正しいかを確認する"
              jq -r '.errors[]? | "  code \(.code): \(.message)"' "$body" 2>/dev/null || cat "$body"
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        if: >-
          steps.cf.outputs.ready == 'true' &&
          (github.event_name == 'schedule' || inputs.deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 作業ディレクトリ直下は git 管理外（2 リポジトリを並べている）で wrangler がブランチを検出できないため、
          # production branch の main を明示して本番（akiya-atlas.pages.dev）に配置する
          command: pages deploy akiya-atlas/dist --project-name=akiya-atlas --branch=main

      - name: 失敗時に Issue で通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure --color B60205 --description "日次パイプラインの失敗" 2>/dev/null || true
          num=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number // empty')
          msg="$(date -u +%FT%TZ) にパイプラインが失敗しました: $RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$msg"
          else
            gh issue create --title "日次パイプラインが失敗しました" --label pipeline-failure \
              --body "$msg （失敗が続く限りこの Issue に追記されます。復旧を確認したら閉じてください）"
          fi
