# 日次パイプライン: crawl → extract → build → (Secrets が揃っていれば) deploy。
# 設計:
#   - Cloudflare の Secrets が未設定でも crawl → extract → build までは必ず動く。
#   - deploy は Cloudflare の Secrets が両方そろっているときだけ実行し、無ければスキップ（run 自体は成功）。
#   - Secrets を後から登録すれば、ワークフローを変更せずに deploy まで動く。
#   - Pages プロジェクト akiya-atlas は deploy の直前に CI が用意する（無ければ作成、あれば何もしない）。
#     ダッシュボードでの手作業も、トークンをローカルに置くことも要らない。
#   - build の直後に、canonical / sitemap / robots が site.toml の base_url を指すことを検査する
#     （ドメイン切替のときに古いホストが残ったまま配置されるのを止める）。
#   - 併せて広告掲載の検査を行う（ADR 0010）。広告表記が欠ける・位置が下がる・ASP へ直リンクする
#     といった状態では配置しない。
#   - Search Console の取り込み（URL 検査で 25 分）は search.yml に分けた。日次の 7 割を占めていて、
#     配置をそれだけ遅らせていたため。巡回・配置と、計測の取り込みは別の関心事。
#   - 手動実行の mode=deploy-only は、巡回・抽出・heal・データのコミットを行わず、main の現在のデータで
#     build → 検査 → deploy だけを行う（テンプレートやデザインの変更を反映するとき）。既定は full。
# 前提（人間側の作業、docs/human-tasks.md）:
#   - GitHub に hikuzawa/sitemill と hikuzawa/akiya-atlas を作成し push する（済み）
#   - Secrets: ANTHROPIC_API_KEY（済み）、CLOUDFLARE_API_TOKEN（Account > Cloudflare Pages: Edit）、
#     CLOUDFLARE_ACCOUNT_ID、GOOGLE_MAPS_EMBED_KEY / CF_WEB_ANALYTICS_TOKEN（任意）。
#     sitemill は public なので読み取り用 PAT は不要
name: pipeline
run-name: "pipeline (${{ inputs.mode || 'full' }})"

on:
  schedule:
    # 毎時 0 分は GitHub の定時実行が混み、遅れやすい。0 分で起動していた 2026-09-17 は 2 時間 54 分遅れた
    - cron: "23 18 * * *" # 03:23 JST
  workflow_dispatch:
    inputs:
      deploy:
        description: "Cloudflare Pages に配置する（Secrets がある場合）"
        type: boolean
        default: true
      mode:
        description: "full: 巡回→抽出→heal→build→検査→deploy ／ deploy-only: 巡回・抽出・heal・データのコミットを行わず、main の現在のデータで build→検査→deploy だけ"
        type: choice
        options:
          - full
          - deploy-only
        default: full

permissions:
  contents: write
  issues: write # 失敗時の通知 Issue と、取り下げ依頼（takedown）の読み取り

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Secrets を env に写して if: で参照できるようにする（if: からは secrets を直接読めない）
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout akiya-atlas
        uses: actions/checkout@v4
        with:
          path: akiya-atlas
          # 全履歴を取る。shallow clone だと「HEAD:main への push」が fast-forward か判定できず、
          # main 以外のブランチから手動実行したときに push が拒否される
          fetch-depth: 0

      - name: Checkout sitemill (path 依存の隣に置く。ADR 0006)
        uses: actions/checkout@v4
        with:
          repository: hikuzawa/sitemill # public。既定の github.token で checkout できる
          ref: v0.6.1 # タグ固定（ADR 0006）。sitemill の main の変更は自動では入らない
          path: sitemill

      - name: Checkout akiya-atlas-ops（保存済み HTML と取り下げ依頼の置き場。private）
        uses: actions/checkout@v4
        with:
          repository: hikuzawa/akiya-atlas-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops

      - name: 保存済み HTML を所定の位置へ（git 管理外。tests/fixtures/README.md）
        run: cp -r ops/fixtures/html akiya-atlas/tests/fixtures/html

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore raw HTML cache (git 管理外)
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        uses: actions/cache@v4
        with:
          path: |
            akiya-atlas/data/raw
            akiya-atlas/data/llm_cache
          key: akiya-atlas-cache-${{ github.run_id }}
          restore-keys: |
            akiya-atlas-cache-

      - name: Sync
        working-directory: akiya-atlas
        run: uv sync --frozen

      - name: Crawl
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        working-directory: akiya-atlas
        run: uv run sitemill crawl

      - name: Extract
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        working-directory: akiya-atlas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run sitemill extract

      - name: Heal（巡回しても 0 件の source を同一サイト内で再評価し、差し替えか状態見直し）
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        working-directory: akiya-atlas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run sitemill heal

      - name: 取り下げ依頼を取り込む（takedown ラベルの Issue → 非表示にするページ）
        working-directory: akiya-atlas
        env:
          # お問い合わせから起票される Issue は非公開の ops 側にある（サイトのプライバシー
          # ポリシーで「非公開の作業管理ツール」と公言しているため）。読むのに PAT が要る
          GH_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        # 依頼が無くても失敗しない。needs-human と municipality の Issue は数えるだけ
        run: uv run akiya-atlas takedowns --repo hikuzawa/akiya-atlas-ops

      - name: Build
        working-directory: akiya-atlas
        env:
          GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}
          CF_WEB_ANALYTICS_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: uv run sitemill build

      - name: 公開 URL の検査（canonical / sitemap / robots が site.toml の base_url を指す）
        working-directory: akiya-atlas
        # 本番ドメインを固定する。base_url を変えるときはここも一緒に変える
        run: uv run python .github/scripts/check_public_urls.py --expect-base https://akiya-atlas.com

      - name: 広告掲載の検査（広告表記の有無と位置・/go/ 経由・宣言との一致。ADR 0010）
        working-directory: akiya-atlas
        run: uv run akiya-atlas ad-check

      # 守りたい性質は、書き込む道具ではなく公開する直前に確かめる（ADR 0016、sitemill ADR 0024）。
      # 巡回をやめた自治体の物件・人が固定した扱い・取り下げ・公言している巡回数。
      # 破れていたら配置しない。取り込み側の歯止めは、別の経路で戻ったものを守らない
      - name: 公開前の性質の検査（ADR 0016）
        working-directory: akiya-atlas
        run: uv run akiya-atlas publish-check

      - name: Eval (fixture、劣化検知)
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        working-directory: akiya-atlas
        run: uv run sitemill eval

      - name: Commit data changes
        id: commit
        if: inputs.mode != 'deploy-only' # deploy-only では飛ばす
        working-directory: akiya-atlas
        # push が競合しても配置（deploy）は続ける。失敗は下の通知ステップが outcome を見て Issue に出す
        continue-on-error: true
        run: |
          git config user.name "sitemill-bot"
          git config user.email "sitemill-bot@users.noreply.github.com"
          # heal は掲載ページを選び直すと data/sources と data/review を書き直す。入れないと毎晩捨てられる
          git add data/state data/records data/runs data/search data/subsidies data/sources data/review data/reference/takedowns.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) の巡回・抽出結果"
          # 人の作業が同時に main へ push されると拒否される。origin/main を取り込み直して最大 3 回まで再試行し、
          # data ファイル自体が競合したら諦める（巡回状態と物件は次回の巡回で再生成される）
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push が拒否された（試行 $attempt/3）。origin/main を取り込んで再試行する"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::data のコミットが origin/main と競合したため push を諦めた（配置は続行）"
              exit 1
            fi
          done
          echo "::error::3 回試しても data を push できなかった（配置は続行）"
          exit 1

      - name: Cloudflare の Secrets を確認
        id: cf
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare の Secrets が未設定のため deploy をスキップします（crawl→extract→build は完了）"
          fi

      - name: Cloudflare Pages プロジェクトを用意（無ければ作成、あれば何もしない）
        if: >-
          steps.cf.outputs.ready == 'true' &&
          (github.event_name == 'schedule' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: akiya-atlas
        run: |
          # 存在確認は Pages API の GET で行う。200 なら既存なので何もしない、404 なら wrangler で作成する。
          # それ以外（400/401/403 など）はトークンの権限やアカウント ID の問題なので、理由を出して止める。
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          case "$status" in
            200)
              echo "Pages プロジェクト $PROJECT_NAME は既に存在する（$(jq -r '.result.subdomain // "?"' "$body")）。作成はスキップ"
              ;;
            404)
              echo "Pages プロジェクト $PROJECT_NAME が無いので作成する（production branch: main）"
              # --force: 新規の静的プロジェクトを Workers に振り替える wrangler の自動委譲を使わず、
              # 必ず Pages プロジェクト（<name>.pages.dev）として作る
              npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main --force
              ;;
            *)
              echo "::error::Pages API が HTTP $status を返した。CLOUDFLARE_API_TOKEN に Account > Cloudflare Pages: Edit の権限があるか、CLOUDFLARE_ACCOUNT_ID が正しいかを確認する"
              jq -r '.errors[]? | "  code \(.code): \(.message)"' "$body" 2>/dev/null || cat "$body"
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        if: >-
          steps.cf.outputs.ready == 'true' &&
          (github.event_name == 'schedule' || inputs.deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 作業ディレクトリ直下は git 管理外（2 リポジトリを並べている）で wrangler がブランチを検出できないため、
          # production branch の main を明示して本番（akiya-atlas-asb.pages.dev）に配置する
          command: pages deploy akiya-atlas/dist --project-name=akiya-atlas --branch=main

      - name: 失敗時に Issue で通知
        if: failure() || steps.commit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # 作業ディレクトリ直下は git 管理外なので、対象リポジトリを明示する
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          gh label create pipeline-failure --color B60205 --description "日次パイプラインの失敗" 2>/dev/null || true
          num=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number // empty')
          if [ "$JOB_STATUS" = "success" ] && [ "$COMMIT_OUTCOME" = "failure" ]; then
            msg="$(date -u +%FT%TZ) に data の push が失敗しました（並行する push と競合。配置は実行済み）: $RUN_URL"
          else
            msg="$(date -u +%FT%TZ) にパイプラインが失敗しました: $RUN_URL"
          fi
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$msg"
          else
            gh issue create --title "日次パイプラインが失敗しました" --label pipeline-failure \
              --body "$msg （失敗が続く限りこの Issue に追記されます。復旧を確認したら閉じてください）"
          fi
