[project]
name = "akiya-atlas"
version = "0.1.0"
description = "自治体が独自に運営する空き家バンクを横断検索できる日本語サイト（sitemill の最初の利用者）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sitemill",
]

[project.scripts]
akiya-atlas = "akiya_atlas.cli:main"

[tool.uv.sources]
# 今フェーズは隣のディレクトリへの editable 依存（docs/adr/0006）。安定後に git タグ固定へ切り替える。
sitemill = { path = "../sitemill", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akiya_atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
