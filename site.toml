# サイト設定。秘密情報は書かない（.env に置く）。
[site]
id = "akiya-atlas"
name = "空き家アトラス"
# 基準 URL はここ 1 か所だけで差し替える。canonical / sitemap / robots はここから決まる。
# Pages の既定ホストは akiya-atlas-asb.pages.dev（akiya-atlas.pages.dev は第三者のプロジェクトが使用中で取得できない）。
# CI（pipeline.yml）は配置前に生成物がこの値を指すこと、この値が本番ドメインであること（--expect-base）を検査する。
base_url = "https://akiya-atlas.com"
service = "akiya_atlas.service:service"
language = "ja"
description = "自治体が運営する空き家バンクを、都道府県・市町村・価格帯・補助金の有無で横断検索できます。物件の要約と一次情報へのリンクだけを載せています。"

[operator]
name = "空き家アトラス 運営"
# 連絡先は Google フォーム（tools/contact_form/ の setup() で作成）。
# フッターの信頼シグナルと /about/ に出る。ここを変えると全ページに反映される。
contact = "https://docs.google.com/forms/d/e/1FAIpQLSdp-CJo64kiw2ifE3zlVY8Dpi6DU0PAZD4gYzsauC8vpokP9g/viewform"

[paths]
data = "data"
templates = "templates"
static = "static"
dist = "dist"
fixtures = "tests/fixtures"

[crawl]
default_delay_seconds = 3.0
jitter_seconds = 1.0
timeout_seconds = 30.0
max_pages_per_source = 50   # サイト全体の上限。各 source の max_pages がこれ以下なら source 側が優先
max_workers = 8             # ホスト並列数（sitemill ADR 0013）。1 ホストあたりの間隔は並列でも縮まらない
# 動きの無いサイトは巡回間隔を延ばす（相手サイトへの負荷を下げる）。下限は週 1 回
adaptive_interval = true
fresh_days = 7              # この日数内に変化があれば毎日
slow_after_days = 28        # これ以上変化が無ければ最長間隔
mid_interval_days = 3       # その中間
max_interval_days = 7       # 最長（＝週 1 回）。新規掲載に気づく遅れの上限でもある

[llm]
provider = "anthropic"
model = "claude-haiku-4-5"
max_input_chars = 60000
max_output_tokens = 32000
temperature = 0.0

[analytics]
provider = "cloudflare"
